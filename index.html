<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- ⭐ MOBILE ZOOM FULL DISABLED + SAFE-AREA SUPPORT ⭐ -->
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Flappy Billions</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
    }

    /* ⭐ IMPORTANT FIX — remove width/height vh/vw stretch ⭐ */
    canvas {
        display: block;
        touch-action: none;
    }

    #billionsText {
        position: absolute;
        top: env(safe-area-inset-top, 15px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 38px;
        font-weight: 900;
        color: #00c8ff;
        font-family: Arial, sans-serif;
        text-shadow: 0 0 5px #00eaff;
        z-index: 9999;
        letter-spacing: 2px;
        pointer-events: none;
    }
</style>
</head>

<body>
<div id="billionsText">Billions Network</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* ⭐ REAL FIX — canvas size set ONLY by JS ⭐ */
function resizeGame() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeGame();
window.addEventListener("resize", resizeGame);

let bgMusic = new Audio("bg.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.5;

let flapSound = new Audio("flap.mp3");
let hitSound = new Audio("hit.mp3");
let coinSound = new Audio("coin.mp3");

let gameStarted = false;
let gameOver = false;

let bird = { x: 100, y: 200, width: 60, height: 60, gravity: 0 };

let birdImg = new Image();
birdImg.src = "billions.png";

let coinImg = new Image();
coinImg.src = "coin.png";

let pipes = [];
let coins = [];
let score = 0;

function createPipe() {
    if (!gameStarted || gameOver) return;

    let gap = 210;
    let top = Math.random() * (canvas.height - gap - 200);

    pipes.push({
        x: canvas.width,
        top: top,
        bottom: top + gap
    });

    coins.push({
        x: canvas.width + 40,
        y: top + gap / 2 - 35,
        width: 70,
        height: 70,
        collected: false
    });
}

setInterval(createPipe, 2500);

function drawGameBackground() {
    let sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
    sky.addColorStop(0, "#00111f");
    sky.addColorStop(0.5, "#00335f");
    sky.addColorStop(1, "#00182f");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(0, 150, 255, 0.04)";
    ctx.beginPath();
    ctx.arc(canvas.width/2, canvas.height/2, 500, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(0,180,255,0.05)";
    ctx.lineWidth = 1;

    for (let i = 0; i < canvas.height; i += 50) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
    }
}

function drawStartMenu() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = "80px Arial Black";
    ctx.fillStyle = "#00c8ff";
    ctx.textAlign = "center";
    ctx.shadowColor = "#0088cc";
    ctx.shadowBlur = 10;
    ctx.fillText("FLAPPY BILLIONS", canvas.width/2, canvas.height/2 - 180);

    ctx.shadowBlur = 0;

    let time = Date.now() / 600;
    let float = Math.sin(time) * 6;
    let pulse = (Math.sin(time * 2) + 2) / 2;
    let size = 160 + pulse * 5;

    ctx.save();
    ctx.shadowColor = "#00ccff";
    ctx.shadowBlur = 15;
    ctx.drawImage(
        birdImg,
        canvas.width/2 - size/2,
        canvas.height/2 - size/2 + float,
        size,
        size
    );
    ctx.restore();

    ctx.font = "40px Arial";
    ctx.fillStyle = "white";
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillText("Tap to Start", canvas.width/2, canvas.height/2 + 220);
    }
}

function drawGameOver() {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00c8ff";
    ctx.font = "60px Arial Black";
    ctx.textAlign = "center";
    ctx.shadowColor = "#0088cc";
    ctx.shadowBlur = 15;
    ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2 - 80);

    ctx.shadowBlur = 0;

    ctx.font = "40px Arial";
    ctx.fillStyle = "white";
    ctx.fillText("Score: " + score, canvas.width/2, canvas.height/2);

    ctx.font = "35px Arial";
    ctx.fillText("Tap to Restart", canvas.width/2, canvas.height/2 + 80);
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameStarted) {
        drawStartMenu();
        requestAnimationFrame(gameLoop);
        return;
    }

    drawGameBackground();

    ctx.drawImage(birdImg, bird.x, bird.y, bird.width, bird.height);
    bird.gravity += 0.22;
    bird.y += bird.gravity;

    if (bird.y > canvas.height - 10) {
        if (!gameOver) hitSound.play();
        gameOver = true;
    }

    pipes.forEach((p) => {
        p.x -= 2;

        ctx.fillStyle = "#0095d9";
        ctx.shadowColor = "#00b4ff";
        ctx.shadowBlur = 10;

        ctx.fillRect(p.x, 0, 80, p.top);
        ctx.fillRect(p.x, p.bottom, 80, canvas.height);

        ctx.shadowBlur = 0;

        if (
            bird.x + bird.width > p.x &&
            bird.x < p.x + 80 &&
            (bird.y < p.top || bird.y + bird.height > p.bottom)
        ) {
            if (!gameOver) hitSound.play();
            gameOver = true;
        }
    });

    /* ⭐ FIXED — each coin always +1 ⭐ */
    coins.forEach((c) => {
        c.x -= 2;

        if (!c.collected) {
            ctx.shadowColor = "#ffd700";
            ctx.shadowBlur = 8;
            ctx.drawImage(coinImg, c.x, c.y, c.width, c.height);
            ctx.shadowBlur = 0;
        }

        const birdCX = bird.x + bird.width / 2;
        const birdCY = bird.y + bird.height / 2;

        const coinCX = c.x + c.width / 2;
        const coinCY = c.y + c.height / 2;

        const distance = Math.hypot(birdCX - coinCX, birdCY - coinCY);
        const touchRadius = (bird.width / 2) + (c.width / 2) - 5;

        if (distance < touchRadius && !c.collected) {
            c.collected = true;
            score = score + 1;
            coinSound.play();
        }
    });

    ctx.fillStyle = "#00eaff";
    ctx.font = "45px Arial Black";
    ctx.shadowColor = "#009be0";
    ctx.shadowBlur = 10;
    ctx.fillText(score, 40, 60);
    ctx.shadowBlur = 0;

    if (gameOver) {
        drawGameOver();
        return;
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();

function flap() {
    if (!gameStarted) {
        gameStarted = true;
        createPipe();
        bgMusic.play();
        return;
    }

    if (gameOver) {
        location.reload();
        return;
    }

    flapSound.play();
    bird.gravity = -5;
}

window.addEventListener("click", flap);
window.addEventListener("keydown", flap);

</script>
</body>
</html>
