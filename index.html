<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- ⭐ ULTRA MOBILE FIX (NO ZOOM + SAFE AREA) ⭐ -->
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Flappy Billions</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        touch-action: none;
        height: 100%;
        width: 100%;
    }

    canvas {
        display: block;
        touch-action: none;
        width: 100% !important;
        height: 100% !important;
    }

    #billionsText {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 12px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 34px;
        font-weight: 900;
        color: #00c8ff;
        font-family: Arial, sans-serif;
        text-shadow: 0 0 5px #00eaff;
        z-index: 99;
        pointer-events: none;
    }
</style>
</head>

<body>
<div id="billionsText">Billions Network</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* ⭐ REAL MOBILE FIX — RETINA / DPR SUPPORT ⭐ */
function resizeGame() {
    const dpr = window.devicePixelRatio || 1;

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    ctx.scale(dpr, dpr);
}
resizeGame();
window.addEventListener("resize", resizeGame);

/* AUDIO */
let bgMusic = new Audio("bg.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.5;

let flapSound = new Audio("flap.mp3");
let hitSound = new Audio("hit.mp3");
let coinSound = new Audio("coin.mp3");

let gameStarted = false;
let gameOver = false;

let bird = { x: 100, y: 200, width: 60, height: 60, gravity: 0 };

let birdImg = new Image();
birdImg.src = "billions.png";

let coinImg = new Image();
coinImg.src = "coin.png";

let pipes = [];
let coins = [];
let score = 0;

function createPipe() {
    if (!gameStarted || gameOver) return;

    let gap = 210;
    let top = Math.random() * (window.innerHeight - gap - 200);

    pipes.push({
        x: window.innerWidth,
        top: top,
        bottom: top + gap
    });

    coins.push({
        x: window.innerWidth + 40,
        y: top + gap / 2 - 35,
        width: 70,
        height: 70,
        collected: false
    });
}
setInterval(createPipe, 2500);

/* BACKGROUND */
function drawGameBackground() {
    let sky = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    sky.addColorStop(0, "#00111f");
    sky.addColorStop(0.5, "#00335f");
    sky.addColorStop(1, "#00182f");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.fillStyle = "rgba(0, 150, 255, 0.04)";
    ctx.beginPath();
    ctx.arc(window.innerWidth/2, window.innerHeight/2, 500, 0, Math.PI * 2);
    ctx.fill();
}

/* START SCREEN */
function drawStartMenu() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.font = "80px Arial Black";
    ctx.fillStyle = "#00c8ff";
    ctx.textAlign = "center";
    ctx.shadowColor = "#0088cc";
    ctx.shadowBlur = 10;
    ctx.fillText("FLAPPY BILLIONS", window.innerWidth/2, window.innerHeight/2 - 180);

    ctx.shadowBlur = 0;

    let time = Date.now() / 600;
    let float = Math.sin(time) * 6;
    let size = 160 + Math.sin(time * 2) * 5;

    ctx.save();
    ctx.shadowColor = "#00ccff";
    ctx.shadowBlur = 15;
    ctx.drawImage(
        birdImg,
        window.innerWidth/2 - size/2,
        window.innerHeight/2 - size/2 + float,
        size,
        size
    );
    ctx.restore();

    ctx.font = "40px Arial";
    ctx.fillStyle = "white";
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillText("Tap to Start", window.innerWidth/2, window.innerHeight/2 + 220);
    }
}

/* GAME OVER */
function drawGameOver() {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.fillStyle = "#00c8ff";
    ctx.font = "60px Arial Black";
    ctx.textAlign = "center";
    ctx.shadowColor = "#0088cc";
    ctx.shadowBlur = 15;
    ctx.fillText("GAME OVER", window.innerWidth/2, window.innerHeight/2 - 80);

    ctx.shadowBlur = 0;

    ctx.font = "40px Arial";
    ctx.fillStyle = "white";
    ctx.fillText("Score: " + score, window.innerWidth/2, window.innerHeight/2);

    ctx.font = "35px Arial";
    ctx.fillText("Tap to Restart", window.innerWidth/2, window.innerHeight/2 + 80);
}

/* MAIN LOOP */
function gameLoop() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    if (!gameStarted) {
        drawStartMenu();
        requestAnimationFrame(gameLoop);
        return;
    }

    drawGameBackground();

    ctx.drawImage(birdImg, bird.x, bird.y, bird.width, bird.height);
    bird.gravity += 0.22;
    bird.y += bird.gravity;

    if (bird.y > window.innerHeight - 10) {
        if (!gameOver) hitSound.play();
        gameOver = true;
    }

    pipes.forEach((p) => {
        p.x -= 2;

        ctx.fillStyle = "#0095d9";
        ctx.shadowColor = "#00b4ff";
        ctx.shadowBlur = 10;

        ctx.fillRect(p.x, 0, 80, p.top);
        ctx.fillRect(p.x, p.bottom, 80, window.innerHeight);

        ctx.shadowBlur = 0;

        if (
            bird.x + bird.width > p.x &&
            bird.x < p.x + 80 &&
            (bird.y < p.top || bird.y + bird.height > p.bottom)
        ) {
            if (!gameOver) hitSound.play();
            gameOver = true;
        }
    });

    /* ⭐ COIN ALWAYS +1 FIX ⭐ */
    coins.forEach((c) => {
        c.x -= 2;

        if (!c.collected) ctx.drawImage(coinImg, c.x, c.y, c.width, c.height);

        let dx = (bird.x + 30) - (c.x + 35);
        let dy = (bird.y + 30) - (c.y + 35);

        if (Math.sqrt(dx*dx + dy*dy) < 55 && !c.collected) {
            c.collected = true;
            score++;
            coinSound.play();
        }
    });

    ctx.fillStyle = "#00eaff";
    ctx.font = "45px Arial Black";
    ctx.shadowColor = "#009be0";
    ctx.shadowBlur = 10;
    ctx.fillText(score, 40, 60);

    if (gameOver) {
        drawGameOver();
        return;
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();

/* TAP */
function flap() {
    if (!gameStarted) {
        gameStarted = true;
        createPipe();
        bgMusic.play();
        return;
    }

    if (gameOver) location.reload();

    flapSound.play();
    bird.gravity = -5;
}
window.addEventListener("click", flap);
window.addEventListener("keydown", flap);

</script>
</body>
</html>
