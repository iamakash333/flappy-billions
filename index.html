<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- REAL MOBILE SAFE-AREA + NO ZOOM -->
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Flappy Billions</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        width: 100%;
        overflow: hidden;
        touch-action: none;
    }

    /* ⭐ FIXED 3:4 CANVAS – BEST ENGAGEMENT */
    #game {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: black;
        width: 90vw;          /* Responsive width */
        height: calc(90vw * 1.33); /* 3:4 ratio */
        max-height: 92vh;
        max-width: calc(92vh * 0.75);
    }

    #billionsText {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 10px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 32px;
        font-weight: 900;
        color: #00c8ff;
        font-family: Arial, sans-serif;
        text-shadow: 0 0 5px #00eaff;
        z-index: 10;
    }
</style>
</head>

<body>

<div id="billionsText">Billions Network</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* ⭐ FIXED INTERNAL GAME SIZE (Stable Gameplay) */
const GAME_WIDTH = 720;
const GAME_HEIGHT = 960;
canvas.width = GAME_WIDTH;
canvas.height = GAME_HEIGHT;

/* AUDIO */
let bgMusic = new Audio("bg.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.5;

let flapSound = new Audio("flap.mp3");
let hitSound = new Audio("hit.mp3");
let coinSound = new Audio("coin.mp3");

let gameStarted = false;
let gameOver = false;

let bird = { x: 120, y: 300, width: 70, height: 70, gravity: 0 };

let birdImg = new Image();
birdImg.src = "billions.png";

let coinImg = new Image();
coinImg.src = "coin.png";

let pipes = [];
let coins = [];
let score = 0;

/* PIPE GENERATION */
function createPipe() {
    if (!gameStarted || gameOver) return;

    let gap = 260;
    let top = Math.random() * (GAME_HEIGHT - gap - 250);

    pipes.push({
        x: GAME_WIDTH,
        top: top,
        bottom: top + gap
    });

    coins.push({
        x: GAME_WIDTH + 40,
        y: top + gap / 2 - 35,
        width: 70,
        height: 70,
        collected: false
    });
}
setInterval(createPipe, 2500);

/* BACKGROUND */
function drawGameBackground() {
    let sky = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
    sky.addColorStop(0, "#00111f");
    sky.addColorStop(0.5, "#00335f");
    sky.addColorStop(1, "#00182f");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    ctx.fillStyle = "rgba(0, 150, 255, 0.04)";
    ctx.beginPath();
    ctx.arc(GAME_WIDTH/2, GAME_HEIGHT/2, 500, 0, Math.PI * 2);
    ctx.fill();
}

/* START SCREEN */
function drawStartMenu() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    ctx.font = "70px Arial Black";
    ctx.fillStyle = "#00c8ff";
    ctx.textAlign = "center";
    ctx.fillText("FLAPPY BILLIONS", GAME_WIDTH/2, GAME_HEIGHT/2 - 180);

    let time = Date.now() / 600;
    let float = Math.sin(time) * 6;
    let size = 150 + Math.sin(time * 2) * 5;

    ctx.save();
    ctx.shadowColor = "#00ccff";
    ctx.shadowBlur = 15;
    ctx.drawImage(birdImg, GAME_WIDTH/2 - size/2, GAME_HEIGHT/2 - size/2 + float, size, size);
    ctx.restore();

    ctx.font = "38px Arial";
    ctx.fillStyle = "white";
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillText("Tap to Start", GAME_WIDTH/2, GAME_HEIGHT/2 + 220);
    }
}

/* GAME OVER */
function drawGameOver() {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    ctx.fillStyle = "#00c8ff";
    ctx.font = "60px Arial Black";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", GAME_WIDTH/2, GAME_HEIGHT/2 - 80);

    ctx.font = "40px Arial";
    ctx.fillStyle = "white";
    ctx.fillText("Score: " + score, GAME_WIDTH/2, GAME_HEIGHT/2);

    ctx.font = "35px Arial";
    ctx.fillText("Tap to Restart", GAME_WIDTH/2, GAME_HEIGHT/2 + 80);
}

/* MAIN LOOP */
function gameLoop() {
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    if (!gameStarted) {
        drawStartMenu();
        requestAnimationFrame(gameLoop);
        return;
    }

    drawGameBackground();

    ctx.drawImage(birdImg, bird.x, bird.y, bird.width, bird.height);
    bird.gravity += 0.22;
    bird.y += bird.gravity;

    if (bird.y > GAME_HEIGHT - 10) {
        if (!gameOver) hitSound.play();
        gameOver = true;
    }

    /* PIPES */
    pipes.forEach((p) => {
        p.x -= 2;

        ctx.fillStyle = "#0095d9";
        ctx.shadowColor = "#00b4ff";
        ctx.shadowBlur = 10;

        ctx.fillRect(p.x, 0, 90, p.top);
        ctx.fillRect(p.x, p.bottom, 90, GAME_HEIGHT);

        ctx.shadowBlur = 0;

        if (
            bird.x + bird.width > p.x &&
            bird.x < p.x + 90 &&
            (bird.y < p.top || bird.y + bird.height > p.bottom)
        ) {
            if (!gameOver) hitSound.play();
            gameOver = true;
        }
    });

    /* COINS */
    coins.forEach((c) => {
        c.x -= 2;

        if (!c.collected) ctx.drawImage(coinImg, c.x, c.y, c.width, c.height);

        let dx = (bird.x + 30) - (c.x + 35);
        let dy = (bird.y + 30) - (c.y + 35);

        if (Math.sqrt(dx*dx + dy*dy) < 55 && !c.collected) {
            c.collected = true;
            score++;
            coinSound.play();
        }
    });

    /* SCORE */
    ctx.fillStyle = "#00eaff";
    ctx.font = "45px Arial Black";
    ctx.shadowColor = "#009be0";
    ctx.shadowBlur = 10;
    ctx.fillText(score, 40, 60);

    if (gameOver) {
        drawGameOver();
        return;
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();

/* TAP */
function flap() {
    if (!gameStarted) {
        gameStarted = true;
        createPipe();
        bgMusic.play();
        return;
    }

    if (gameOver) location.reload();

    flapSound.play();
    bird.gravity = -5;
}
window.addEventListener("click", flap);
window.addEventListener("keydown", flap);
</script>

</body>
</html>
